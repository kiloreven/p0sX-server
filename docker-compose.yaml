
version: "3.5"

services:
  server:
    build:
      context: .
      dockerfile: ./Dockerfile
    environment:
      - DJANGO_SETTINGS_MODULE=p0sx.settings.env
    image: p0sx-server
    command: prod
    volumes:
      - "./media:/code/media"
      - "./logs:/logs"
      - "pip-cache:/tmp/pip"
      - "ipython-data-local:/root/.ipython/profile_default"   # persist ipython data, including ipython history
      - "/etc/localtime:/etc/localtime:ro"
    env_file:
      - ".env"
    ports:
      - "127.0.0.1:8004:8081"
    restart: "always"

  db:
    image: "postgres:11"
    restart: "always"
    # set shared memory limit when using docker compose
    shm_size: "128mb"
    # or set shared memory limit when deploy via swarm stack
    #volumes:
    #  - type: tmpfs
    #    target: /dev/shm
    #    tmpfs:
    #      size: 134217728 # 128*2^20 bytes = 128Mb
    env_file: ".env"
    volumes:
      - "database:/var/lib/postgresql/data"

      # server-ext:
      #   build:
      #     context: .
      #     dockerfile: ./Dockerfile
      #   environment:
      #     - DJANGO_SETTINGS_MODULE=p0sx.settings.dev
      #   image: p0sx-server
      #   volumes:
      #     - ".:/srv/app"
      #     - "./media:/media"
      #     - "./logs:/logs"
      #     - "pip-cache:/tmp/pip"
      #     - "ipython-data-local:/root/.ipython/profile_default"   # persist ipython data, including ipython history
      #     - "/etc/localtime:/etc/localtime:ro"
      #   ports:
      #     - "8080:8080"
      #   restart: always

volumes:
  pip-cache:
    driver: local
  ipython-data-local:
    driver: local
  database:
    driver: local
